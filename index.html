<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>studio:Revolver - Stills Portfolio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Theme tokens ── */
    :root {
      --bg:           #0b0b0b;
      --bg-still:     #1a1a1a;
      --fg:           rgba(255,255,255,0.85);
      --fg-muted:     rgba(255,255,255,0.25);
      --fg-hover:     rgba(255,255,255,0.7);
      --border:       rgba(255,255,255,0.08);
      --lb-bg:        rgba(0,0,0,0.92);
      --lb-btn:       rgba(255,255,255,0.12);
      --lb-btn-hover: rgba(255,255,255,0.22);
      --lb-fg:        rgba(255,255,255,0.6);
    }
    [data-theme="light"] {
      --bg:           #f5f5f5;
      --bg-still:     #d8d8d8;
      --fg:           rgba(0,0,0,0.85);
      --fg-muted:     rgba(0,0,0,0.3);
      --fg-hover:     rgba(0,0,0,0.7);
      --border:       rgba(0,0,0,0.08);
      --lb-bg:        rgba(245,245,245,0.95);
      --lb-btn:       rgba(0,0,0,0.08);
      --lb-btn-hover: rgba(0,0,0,0.16);
      --lb-fg:        rgba(0,0,0,0.5);
    }

    @font-face {
      font-family: "Antique Legacy";
      src: url("fonts/Antique-Legacy-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: "Antique Legacy";
      src: url("fonts/Antique-Legacy-Book.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }

    html {
      height: 100%;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Antique Legacy", serif;
      font-weight: 300;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s, color 0.25s;
      font-kerning: none;
      letter-spacing: 0;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px 40px;
    }

    /* ── Header ── */
    header {
      padding: 48px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 11px;
      font-weight: 400;
      text-transform: uppercase;
      color: var(--fg);
    }

    /* ── Theme toggle ── */
    .theme-control {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .theme-label {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--fg-muted);
      transition: color 0.2s;
    }
    .theme-control:hover .theme-label { color: var(--fg-hover); }

    /* circle toggle */
    .switch-track {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid var(--fg);
      background: transparent;
      transition: background 0.3s, border-color 0.3s;
      flex-shrink: 0;
    }
    .theme-control:hover .switch-track {
      background: var(--fg);
    }

    .switch-knob { display: none; }

    .divider { display: none; }

    /* ── Grid wrapper (non-scrolling, holds overlay) ── */
    .grid-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* ── Grid ── */
    .grid {
      height: 100%;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .grid::-webkit-scrollbar { display: none; }

    /* ── Row ── */
    .h-row {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 24px;
      align-items: stretch;
    }

    /* ── Project group ── */
    .proj-group {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .proj-images {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 4px;
      align-items: stretch;
    }

    /* dedicated slot below images for the JS-driven sticky title */
    .proj-title-slot {
      flex-shrink: 0;
      height: 28px;
      position: relative;
      overflow: visible;
    }

    .proj-sticky-title {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 9px;
      color: var(--fg-muted);
      white-space: nowrap;
      transition: color 0.2s;
    }
    .proj-group:hover .proj-sticky-title { color: var(--fg); }

    /* line lives inside the slot — same coord space, no conversion needed */
    .proj-title-line {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 0;
      height: 1px;
      background: var(--fg);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .proj-group:hover .proj-title-line { opacity: 1; }

    /* ── Still ── */
    .still {
      flex-shrink: 0;
      height: 100%;
      cursor: pointer;
    }
    .still:hover .still-img { opacity: 0.8; }

    .still-img {
      height: 100%;
      overflow: hidden;
      background: var(--bg-still);
      transition: opacity 0.2s;
    }

    .still img {
      height: 100%;
      width: auto;
      display: block;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .still img.loaded { opacity: 1; }

    /* loading state */
    .grid-loading {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      font-size: 9px;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      padding: 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links {
      display: flex;
      gap: 28px;
    }

    footer a {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--fg-hover); }

    .footer-copy {
      font-size: 9px;
      color: var(--fg-muted);
      opacity: 0.5;
    }

    /* ── Lightbox ── */
    .lb {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--lb-bg);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .lb.open { display: flex; }

    .lb-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-img {
      max-width: calc(100vw - 120px);
      max-height: calc(100vh - 80px);
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .lb-img.loaded { opacity: 1; }

    .lb-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: var(--lb-fg);
      font-family: inherit;
      font-size: 9px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 6px 0;
      transition: color 0.2s;
    }
    .lb-close:hover { color: var(--fg); }

    .lb-meta {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      align-items: baseline;
      white-space: nowrap;
    }

    .lb-project {
      font-size: 9px;
      color: var(--lb-fg);
    }

    .lb-counter {
      font-size: 9px;
      color: var(--lb-fg);
      opacity: 0.5;
    }

    .lb-prev, .lb-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--lb-btn);
      border: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 9px;
      text-transform: uppercase;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .lb-prev:hover, .lb-next:hover { background: var(--lb-btn-hover); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      header { padding: 16px 0 16px; }

      /* scroll the feed, not the page */
      body { overflow: hidden; padding: 8px 16px; }
      .grid-wrapper { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

      /* 2-column masonry */
      .grid {
        height: auto;
        overflow: visible;
        display: block;
        column-count: 2;
        column-gap: 2px;
        padding: 2px;
      }

      /* flatten nested structure so stills flow into columns */
      .h-row, .proj-group, .proj-images { display: contents; }

      .still {
        break-inside: avoid;
        margin-bottom: 2px;
      }

      /* native ratios */
      .still { height: auto !important; width: 100%; }
      .still-img { height: auto !important; width: 100%; }
      .still img { width: 100% !important; height: 100% !important; object-fit: cover; }

      /* hide desktop titles */
      .proj-title-slot { display: none; }

      footer { padding: 20px 16px; flex-direction: column; align-items: flex-start; gap: 12px; }

      .lb-prev, .lb-next { padding: 16px 14px; }
      .lb-img { max-width: 100vw; max-height: calc(100vh - 100px); }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="title">Studio:Revolver / Stills</h1>
    <label class="theme-control" id="themeToggle" title="Toggle theme">
      <div class="switch-track">
        <div class="switch-knob"></div>
      </div>
    </label>
  </header>
  <hr class="divider" />

  <div class="grid-wrapper">
    <section class="grid" id="grid">
      <div class="grid-loading" id="gridLoading">Loading</div>
    </section>
  </div>

  <footer>
    <div class="footer-links">
      <a href="https://revolver.ws" target="_blank" rel="noopener noreferrer">revolver.ws</a>
      <a href="https://instagram.com/revolver.ws" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="mailto:lizzie@revolver.ws">Contact</a>
    </div>
    <span class="footer-copy">© studio:Revolver</span>
  </footer>

  <!-- Lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true">
    <div class="lb-inner">
      <button class="lb-close" id="lbClose">Close</button>
      <button class="lb-prev" id="lbPrev">← Prev</button>
      <img class="lb-img" id="lbImg" src="" alt="" />
      <button class="lb-next" id="lbNext">Next →</button>
      <div class="lb-meta">
        <span class="lb-project" id="lbProject"></span>
        <span class="lb-counter" id="lbCounter"></span>
      </div>
    </div>
  </div>

  <script>
    const CLOUD = 'dn9nqgxni';

    // ── Custom display titles per project tag ──
    const PROJECT_TITLES = {
      'rev-golf':         'Golf',
      'rev-whiskas':      'Whiskas — Cat Conversion System',
      'nedd':             'Samsung — Nedd Brockmann',
      'rev-josh':         'Samsung — Josh Heuston',
      'rev-amp':          'AMP — Super Close to Your Super',
      'rev-welcomepacks': 'Samsung — Welcome Packs',
      'norco':            'Norco — Cowsplay',
      'rev-spirit':       'Spirit of Tasmania — Pack More In, Get More Out',
      'portraits':        'Portraits',
    };

    // ── Add a new project tag here each time you create a new job ──
    const PROJECT_TAGS = [
      'rev-josh',
      'nedd',
      'norco',
      'rev-amp',
      'rev-welcomepacks',
      'portraits',
      'rev-spirit',
      'rev-whiskas',
      'rev-golf',
    ];

    function imgUrl(publicId, width = 1400) {
      return `https://res.cloudinary.com/${CLOUD}/image/upload/f_auto,q_auto,w_${width}/${publicId}`;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function fetchTag(tag) {
      try {
        const res = await fetch(`https://res.cloudinary.com/${CLOUD}/image/list/${tag}.json`);
        if (!res.ok) return [];
        const { resources } = await res.json();
        return resources ?? [];
      } catch {
        return [];
      }
    }

    // ── Theme toggle ──
    const toggle     = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    toggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeLabel.textContent = isDark ? 'Light' : 'Dark';
    });

    // ── Lightbox ──
    const lb        = document.getElementById('lb');
    const lbImg     = document.getElementById('lbImg');
    const lbCounter = document.getElementById('lbCounter');
    const lbProject = document.getElementById('lbProject');
    let lbImages = [];
    let current  = 0;

    const preloadCache = {};
    function preload(index) {
      const i = (index + lbImages.length) % lbImages.length;
      if (!lbImages[i] || preloadCache[i]) return;
      const pre = new Image();
      pre.src = imgUrl(lbImages[i].public_id, 1800);
      preloadCache[i] = pre;
    }

    function show(lbIndex) {
      current = (lbIndex + lbImages.length) % lbImages.length;
      const img = lbImages[current];

      lbImg.classList.remove('loaded');
      lbImg.src = imgUrl(img.public_id, 900); // cached from grid — shows instantly
      lbImg.classList.add('loaded');

      const hiRes = new Image();
      const thisIndex = current;
      hiRes.src = imgUrl(img.public_id, 1800);
      hiRes.onload = () => { if (current === thisIndex) lbImg.src = hiRes.src; };

      const proj      = img._project || '';
      const projImgs  = lbImages.filter(i => i._project === proj);
      const posInProj = projImgs.indexOf(img) + 1;
      lbProject.textContent = proj;
      lbCounter.textContent = `${String(posInProj).padStart(2,'0')} / ${String(projImgs.length).padStart(2,'0')}`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';

      preload(current + 1);
      preload(current - 1);
    }

    function closeLb() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    document.getElementById('lbClose').addEventListener('click', closeLb);
    document.getElementById('lbPrev').addEventListener('click', () => show(current - 1));
    document.getElementById('lbNext').addEventListener('click', () => show(current + 1));
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLb();
      if (e.key === 'ArrowLeft')  show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });

    function formatTag(tag) {
      return PROJECT_TITLES[tag] || tag.replace(/^rev-/, '').replace(/-/g, ' ');
    }

    // ── Fetch + build ──
    async function buildGrid() {
      const grid    = document.getElementById('grid');
      const loading = document.getElementById('gridLoading');

      try {
        const projectResources = await Promise.all(PROJECT_TAGS.map(fetchTag));

        // Pair each tag with its shuffled images, filter empty, shuffle group order
        const groups = shuffle(
          PROJECT_TAGS
            .map((tag, i) => ({ tag, imgs: shuffle(projectResources[i]) }))
            .filter(g => g.imgs.length > 0)
        );

        // Flat list for lightbox, tagged with project name
        lbImages = groups.flatMap(({ tag, imgs }) =>
          imgs.map(img => ({ ...img, _project: formatTag(tag) }))
        );

      } catch (err) {
        loading.textContent = 'Could not load images.';
        console.error(err);
        return;
      }

      // Group lbImages into consecutive project blocks
      const projBlocks = [];
      lbImages.forEach(img => {
        const last = projBlocks[projBlocks.length - 1];
        if (last && last.name === img._project) last.imgs.push(img);
        else projBlocks.push({ name: img._project, imgs: [img] });
      });

      // Greedy bin-packing: assign each project to the shorter row
      const rowBlocks = [[], []];
      const rowWidths = [0, 0];
      projBlocks.forEach(block => {
        const w = block.imgs.reduce((s, img) => s + (img.width || 1) / (img.height || 1), 0);
        const shorter = rowWidths[0] <= rowWidths[1] ? 0 : 1;
        rowBlocks[shorter].push(block);
        rowWidths[shorter] += w;
      });

      grid.innerHTML = '';

      rowBlocks.forEach(blocks => {
        const rowEl = document.createElement('div');
        rowEl.className = 'h-row';

        blocks.forEach(block => {
          const groupEl = document.createElement('div');
          groupEl.className = 'proj-group';

          // Images row
          const imgsEl = document.createElement('div');
          imgsEl.className = 'proj-images';

          block.imgs.forEach(img => {
            const lbIndex = lbImages.indexOf(img);

            const cell = document.createElement('div');
            cell.className = 'still';
            cell.addEventListener('click', () => show(lbIndex));

            const imgWrap = document.createElement('div');
            imgWrap.className = 'still-img';
            imgWrap.style.aspectRatio = `${img.width || 1} / ${img.height || 1}`;

            const el = document.createElement('img');
            el.src      = imgUrl(img.public_id, 900);
            el.alt      = '';
            el.draggable = false;
            el.addEventListener('load', () => el.classList.add('loaded'));
            if (el.complete) el.classList.add('loaded');

            imgWrap.appendChild(el);
            cell.appendChild(imgWrap);
            imgsEl.appendChild(cell);
          });

          groupEl.appendChild(imgsEl);

          // Title slot: fixed 28px strip below images
          const titleSlot = document.createElement('div');
          titleSlot.className = 'proj-title-slot';

          const stickyTitle = document.createElement('div');
          stickyTitle.className = 'proj-sticky-title';
          stickyTitle.textContent = block.name;

          const titleLine = document.createElement('div');
          titleLine.className = 'proj-title-line';

          titleSlot.appendChild(stickyTitle);
          titleSlot.appendChild(titleLine);
          groupEl.appendChild(titleSlot);

          // Store data for width calculation and sticky title detection
          const ratioSum = block.imgs.reduce((s, img) => s + (img.width || 1) / (img.height || 1), 0);
          groupEl.dataset.ratioSum  = ratioSum;
          groupEl.dataset.imgCount  = block.imgs.length;
          groupEl.dataset.title     = block.name;

          rowEl.appendChild(groupEl);
        });

        grid.appendChild(rowEl);
      });

      // Wait two frames for the flex layout to settle before measuring
      requestAnimationFrame(() => requestAnimationFrame(() => {
        applyGroupWidths();
        updateStickyTitles();
      }));
    }

    // Disable right-click on all images
    document.addEventListener('contextmenu', e => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    // Set explicit pixel widths on proj-groups based on actual rendered image height
    function applyGroupWidths() {
      document.querySelectorAll('.proj-group').forEach(group => {
        const imgsEl = group.querySelector('.proj-images');
        const imgsH  = imgsEl ? imgsEl.offsetHeight : 0;
        if (!imgsH) return;
        const ratioSum = parseFloat(group.dataset.ratioSum);
        const imgCount = parseInt(group.dataset.imgCount);
        const w = ratioSum * imgsH + (imgCount - 1) * 4;
        group.style.width = w + 'px';
        // Title slot matches group width so absolute positioning works
        const slot = group.querySelector('.proj-title-slot');
        if (slot) slot.style.width = w + 'px';
      });
    }
    window.addEventListener('resize', applyGroupWidths);

    // JS sticky simulation — no overlay, lines live inside each slot
    function updateStickyTitles() {
      const gridEl   = document.getElementById('grid');
      const gridRect = gridEl.getBoundingClientRect();
      const pinX     = gridRect.left;

      gridEl.querySelectorAll('.h-row').forEach(row => {
        const groups = Array.from(row.querySelectorAll('.proj-group'));

        // Active = last group whose left has crossed pinX
        let active = groups[0];
        groups.forEach(g => {
          if (g.getBoundingClientRect().left <= pinX) active = g;
        });

        groups.forEach(group => {
          const titleEl = group.querySelector('.proj-sticky-title');
          const lineEl  = group.querySelector('.proj-title-line');
          if (!titleEl) return;

          const groupRect = group.getBoundingClientRect();
          const imgsRight = group.querySelector('.proj-images')?.getBoundingClientRect().right ?? groupRect.right;

          // JS sticky: clamp title between 0 and last-image right edge
          const raw      = pinX - groupRect.left;
          const max      = imgsRight - groupRect.left - titleEl.offsetWidth;
          const titleLeft = Math.max(0, Math.min(raw, max));
          titleEl.style.left = titleLeft + 'px';

          // Line: starts after title text, ends at slot's right edge (right: 0)
          if (lineEl) {
            lineEl.style.left = (titleLeft + titleEl.offsetWidth + 16) + 'px';
          }
        });
      });
    }

    // Convert vertical scroll to horizontal on the grid
    const gridEl = document.getElementById('grid');
    gridEl.addEventListener('wheel', e => {
      if (window.innerWidth <= 600) return; // let mobile scroll vertically
      if (e.deltaY === 0) return;
      e.preventDefault();
      e.currentTarget.scrollLeft += e.deltaY;
    }, { passive: false });
    gridEl.addEventListener('scroll', updateStickyTitles);

    buildGrid();
  </script>

</body>
</html>
